name: TumbleGrove
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 8XX87M89M2
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  TumbleGrove:
    type: application
    platform: iOS
    sources:
      - path: TumbleGrove/Sources
      - path: TumbleGrove/Assets.xcassets
      - path: TumbleGrove/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: TumbleGrove/Web
        type: folder
        buildPhase: resources
    info:
      path: TumbleGrove/Info.plist
      properties:
        CFBundleDisplayName: Tumble Grove
        CFBundleName: Tumble Grove
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSMotionUsageDescription: Tilt your device to roll fruit in Gravity mode. Motion is used only on your device while you play.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.franmora.tumblegrove
        PRODUCT_NAME: TumbleGrove
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
  TumbleGroveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TumbleGroveTests
    dependencies:
      - target: TumbleGrove
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.franmora.tumblegrove.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TumbleGrove:
    build:
      targets:
        TumbleGrove: all
        TumbleGroveTests: [test]
    test:
      targets:
        - TumbleGroveTests
    archive:
      config: Release
